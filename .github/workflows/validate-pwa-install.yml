name: Validate LOCAL MARS PWA installation

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "parcels/**"
      - "member-workspace.js"
      - "parcels/**"
      - ".github/workflows/validate-pwa-install.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/validate-pwa-install.yml"

permissions:
  contents: read

jobs:
  pwa-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate install UI, manifest and offline cache
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          sw = Path("sw.js").read_text(encoding="utf-8")
          workspace = Path("member-workspace.js").read_text(encoding="utf-8")
          chat = Path("chat.js").read_text(encoding="utf-8")

          required_html = [
              'id="lmInstallDock"',
              'id="lmInstallAppBtn"',
              'id="lmInstallDialog"',
              'id="local-mars-install-controller"',
              "beforeinstallprompt",
              "appinstalled",
              "serviceWorker.getRegistration",
          ]
          for item in required_html:
              assert item in html, f"install feature missing: {item}"

          assert manifest.get("display") == "standalone", "PWA display must be standalone"
          assert manifest.get("start_url") == "./", "PWA start_url must respect GitHub Pages project path"
          assert manifest.get("scope") == "./", "PWA scope must respect GitHub Pages project path"
          assert manifest.get("prefer_related_applications") is False, "PWA must prefer web installation"
          icons = manifest.get("icons", [])
          assert any(icon.get("sizes") == "192x192" for icon in icons), "192x192 install icon declaration missing"
          assert any(icon.get("sizes") == "512x512" for icon in icons), "512x512 install icon declaration missing"
          for icon in icons:
              path = icon.get("src", "").removeprefix("./")
              assert path and Path(path).is_file(), f"manifest icon not found: {path}"

          assert 'const CACHE = "local-mars-v4-77"' in sw, "service worker cache version was not bumped"
          assert "Dashboard · แดชบอร์ด" in html and 'data-lm-en="Dashboard"' in html, "Member Dashboard entry missing"
          assert "แดชบอร์ดสมาชิก" in html, "Dashboard title missing"
          assert 'id="lmChatOverlay"' in html and 'data-system-target="chat"' in html, "Live chat UI and menu entry missing"
          assert 'id="lmChatOpen"' in html and '"./chat.js"' in sw, "Chat launcher and offline asset missing"
          assert 'src="./chat.js"' in html and "mars_chat_messages" in chat and "postgres_changes" in chat and "presence" in chat, "Live chat client integration missing"
          assert 'data-search-terms="ตลาด ซื้อขายที่ดิน ราคา mlc marketplace land listing"' in html, "Thai and English marketplace search terms missing"
          assert ".lm-system-grid{grid-template-columns:minmax(0,1fr)" in html, "mobile More menu must use readable single-column cards"
          assert '"./member-workspace.js"' in sw, "member workspace missing from offline cache"
          assert '<script src="./member-workspace.js" defer></script>' in html, "member workspace script missing"
          assert "postgres_changes" in workspace, "member workspace Realtime subscription missing"
          assert "isNewParcel=Number(p.id.slice(2))>=13" in html, "new parcel marker renderer missing"
          assert "const canAfford=walletReady&&balanceValue>=price" in html, "MLC insufficient-balance purchase guard missing"
          assert "TorusGeometry(.038,.0028,8,48)" in html, "new parcel marker ring missing"
          for n in range(1, 20):
              route = Path(f"parcels/M-{n:03}/index.html")
              assert route.is_file(), f"offline parcel route missing: {route}"
              assert f"parcel=M-{n:03}" in route.read_text(encoding="utf-8"), f"parcel route target mismatch: {route}"
              assert f'"./parcels/M-{n:03}/index.html"' in sw, f"offline cache entry missing: M-{n:03}"
          assert Path("parcels/index.html").is_file(), "parcel directory index missing"
          assert '"./parcels/index.html"' in sw, "parcel directory missing from offline cache"
          assert '"./manifest.webmanifest"' in sw and '"./icon.svg"' in sw, "PWA core assets missing from offline cache"

          marker = '<script id="local-mars-install-controller">'
          assert marker in html, "install controller script not found"
          script_start = html.index(marker) + len(marker)
          script_end = html.index("</script>", script_start)
          Path("/tmp/local-mars-install.js").write_text(html[script_start:script_end], encoding="utf-8")
          Path("/tmp/local-mars-chat.js").write_text(chat, encoding="utf-8")
          print("LOCAL MARS PWA install UI, browser events, manifest and offline cache validated.")
          PY
          node --check /tmp/local-mars-install.js
          node --check /tmp/local-mars-chat.js
