name: Deploy LOCAL MARS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate complete app, routes, localization and mobile entry points
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          required = [
              "index.html", "city.html", "underground.html",
              "m003-base.html", "m003-dimension-gate.html", "top-secret-demo.html",
              "civilization.html", "i18n.js", "premium-ui.css",
              "world-server.js", "multiverse.js", "easy-play.js",
              "manifest.webmanifest", "sw.js", "icon.svg",
              "locales/th.json", "locales/en.json",
          ]
          for item in required:
              assert Path(item).is_file(), f"required app asset missing: {item}"

          for n in range(1, 13):
              route = Path(f"parcels/M-{n:03}/index.html")
              assert route.is_file(), f"parcel route missing: {route}"
              source = route.read_text(encoding="utf-8")
              assert f"parcel=M-{n:03}" in source, f"parcel route target mismatch: {route}"

          html = Path("index.html").read_text(encoding="utf-8")
          city = Path("city.html").read_text(encoding="utf-8")
          underground = Path("underground.html").read_text(encoding="utf-8")
          dimension_gate = Path("m003-dimension-gate.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          sw = Path("sw.js").read_text(encoding="utf-8")
          th = json.loads(Path("locales/th.json").read_text(encoding="utf-8"))
          en = json.loads(Path("locales/en.json").read_text(encoding="utf-8"))

          assert '<link rel="manifest" href="./manifest.webmanifest">' in html, "manifest link missing"
          assert "navigator.serviceWorker.register('./sw.js'" in html, "service worker registration missing"
          assert manifest.get("start_url") == "./" and manifest.get("scope") == "./", "manifest paths must be relative to the GitHub Pages project root"
          assert th and en, "Thai and English dictionaries must not be empty"
          for icon in manifest.get("icons", []):
              path = icon.get("src", "").removeprefix("./")
              assert path and Path(path).is_file(), f"manifest icon missing: {path}"

          importmap = re.search(r'<script type="importmap">\\s*(.*?)\\s*</script>', html, re.S)
          assert importmap, "Three.js import map missing"
          imports = json.loads(importmap.group(1)).get("imports", {})
          assert imports.get("three", "").endswith("/build/three.module.js"), "Three.js module mapping missing"
          assert imports.get("three/addons/", "").endswith("/examples/jsm/"), "Three.js addons mapping missing"
          assert "from 'three/addons/controls/OrbitControls.js'" in html, "OrbitControls import missing"
          assert "location.href='./city.html'" in html and "location.href='./underground.html'" in html, "main navigation target missing"
          assert 'href="./m003-dimension-gate.html"' in Path("m003-base.html").read_text(encoding="utf-8"), "M-003 Dimension Gate link missing"
          assert "PROJECT DIMENSION GATE" in dimension_gate, "Dimension Gate page content missing"

          for asset in (
              '"./"', '"./index.html"', '"./city.html"', '"./underground.html"',
              '"./m003-base.html"', '"./m003-dimension-gate.html"', '"./top-secret-demo.html"',
              '"./civilization.html"', '"./i18n.js"', '"./premium-ui.css"',
              '"./world-server.js"', '"./multiverse.js"', '"./easy-play.js"',
              '"./locales/th.json"', '"./locales/en.json"',
              '"./manifest.webmanifest"', '"./icon.svg"'
          ):
              assert asset in sw, f"service worker precache entry missing: {asset}"
          for n in range(1, 13):
              assert f'"./parcels/M-{n:03}/index.html"' in sw, f"parcel offline cache entry missing: M-{n:03}"

          module = re.search(r'<script type="module">\\s*(.*?)\\s*</script>', html, re.S)
          assert module, "application module missing"
          Path("/tmp/mars-main.mjs").write_text(module.group(1), encoding="utf-8")

          city_module = re.search(r'<script type="module">\\s*(.*?)\\s*</script>', city, re.S)
          assert city_module, "city builder module missing"
          assert 'id="constructionList"' in city, "construction progress panel missing"
          assert "function updateConstructionJobs" in city, "construction simulation loop missing"
          Path("/tmp/mars-city.mjs").write_text(city_module.group(1), encoding="utf-8")

          underground_script = re.search(r'<script>\\s*(.*?)\\s*</script>', underground, re.S)
          assert underground_script, "underground simulator script missing"
          assert "const floors=[" in underground_script.group(1), "24-level base data missing"
          Path("/tmp/mars-underground.js").write_text(underground_script.group(1), encoding="utf-8")

          print("LOCAL MARS: app routes, all 12 parcel routes, M-003, TOP SECRET demo, premium assets, TH/EN dictionaries and PWA assets validated.")
          PY
          node --check /tmp/mars-main.mjs
          node --check /tmp/mars-city.mjs
          node --check /tmp/mars-underground.js
          node --check sw.js
          node --check world-server.js
          node --check multiverse.js
          node --check easy-play.js
          node --check i18n.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare complete static site
        run: |
          mkdir -p _site
          cp index.html city.html underground.html m003-base.html m003-dimension-gate.html top-secret-demo.html civilization.html i18n.js premium-ui.css world-server.js multiverse.js easy-play.js manifest.webmanifest sw.js icon.svg _site/
          cp -R locales _site/locales
          cp -R parcels _site/parcels
          touch _site/.nojekyll
          test -s _site/locales/th.json
          test -s _site/locales/en.json
          test -s _site/m003-base.html
          test -s _site/m003-dimension-gate.html
          test -s _site/top-secret-demo.html
          test -s _site/premium-ui.css
          test -s _site/parcels/M-001/index.html
          test -s _site/parcels/M-012/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Clear stale GitHub Pages deployment lock
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment: 'github-pages', per_page: 100
            });
            for (const deployment of deployments) {
              if (deployment.sha === context.sha) continue;
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 10
              });
              const latest = statuses.data[0];
              if (latest?.state === 'in_progress') {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Superseded by a newer LOCAL MARS deployment.'
                });
                core.notice(`Marked stale Pages deployment ${deployment.id} (${deployment.sha}) inactive.`);
              }
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
