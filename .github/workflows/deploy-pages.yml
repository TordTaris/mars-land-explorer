name: Deploy LOCAL MARS to GitHub Pages

# GitHub Pages is deployed by the repository's configured branch source.
# Keep this workflow manual-only to avoid competing Pages deployments on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages-cleanup
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale GitHub Pages deployment locks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const staleShas = [
              '76338d1dcd31e9b1017562f03ec371e64bd772e4',
              '53a13e185229dda3963031b069190d2ea55ae8c4',
              '4507c6b854b57125b63f92c65fa3fae8b342a77f'
            ];
            for (const sha of staleShas) {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                  owner, repo, pages_deployment_id: sha
                });
                core.notice(`Cancelled stale Pages deployment ${sha}.`);
              } catch (error) {
                core.warning(`Cancel for ${sha}: ${error.status || 'error'} ${error.message}`);
              }
            }

  deploy:
    needs: cancel-stale
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate complete app, routes, localization and mobile entry points
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          required = [
              "index.html", "dual-ai.html", "download-ai.html", "install.html", "member-workspace.js", "solar-system.js", "digital-assets.js", "city.html", "underground.html", "mission-trainer.html", "news.html",
              "m003-base.html", "m003-dimension-gate.html", "top-secret-demo.html",
              "civilization.html", "i18n.js", "premium-ui.css",
              "world-server.js", "nasa-data.js", "multiverse.js", "easy-play.js", "chat.js",
              "manifest.webmanifest", "sw.js", "icon.svg",
              "locales/th.json", "locales/en.json",
          ]
          for item in required:
              assert Path(item).is_file(), f"required app asset missing: {item}"

          for n in range(1, 20):
              route = Path(f"parcels/M-{n:03}/index.html")
              assert route.is_file(), f"parcel route missing: {route}"
              source = route.read_text(encoding="utf-8")
              assert f"parcel=M-{n:03}" in source, f"parcel route target mismatch: {route}"

          html = Path("index.html").read_text(encoding="utf-8")
          city = Path("city.html").read_text(encoding="utf-8")
          underground = Path("underground.html").read_text(encoding="utf-8")
          mission = Path("mission-trainer.html").read_text(encoding="utf-8")
          news = Path("news.html").read_text(encoding="utf-8")
          workspace = Path("member-workspace.js").read_text(encoding="utf-8")
          chat = Path("chat.js").read_text(encoding="utf-8")
          dual_ai = Path("dual-ai.html").read_text(encoding="utf-8")
          dual_ai_scripts = re.findall(r"<script(?:\s+type=\"module\")?>(.*?)</script>", dual_ai, re.S)
          dual_ai_code = "\n".join(dual_ai_scripts)
          assert dual_ai_scripts and "functions.invoke" in dual_ai_code, "Dual AI client integration missing"
          assert "XAI_API_KEY" not in dual_ai and "OPENAI_API_KEY" not in dual_ai, "Provider API keys must never appear in browser code"
          Path("/tmp/local-mars-dual-ai.js").write_text(dual_ai_code, encoding="utf-8")
          dimension_gate = Path("m003-dimension-gate.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          sw = Path("sw.js").read_text(encoding="utf-8")
          th = json.loads(Path("locales/th.json").read_text(encoding="utf-8"))
          en = json.loads(Path("locales/en.json").read_text(encoding="utf-8"))

          assert '<link rel="manifest" href="./manifest.webmanifest">' in html, "manifest link missing"
          assert 'id="local-mars-install-controller"' in html, "LOCAL MARS install controller missing"
          assert 'id="lmWorkspaceOverlay"' in html and 'id="lmWorkspaceOpen"' in html and 'id="lmWorkspaceCreations"' in html, "member workspace dashboard missing"
          assert '<script src="./member-workspace.js" defer></script>' in html, "member workspace script missing"
          assert "postgres_changes" in workspace and ".eq(column,user.id)" in workspace, "member workspace must use owner-scoped Realtime data"
          assert "mars_city_buildings" in workspace and "mars_underground_cells" in workspace, "member creation modules missing from workspace"
          assert 'id="lmMoreInstallBtn"' in html and 'id="lmInstallDialog"' in html and 'id="local-mars-install-controller"' in html, "More-menu install flow missing"
          assert 'id="lmSystemHubFloat"' not in html, "floating System Hub launcher must remain removed"
          assert 'id="lmSystemsToggle"' in html and 'id="lmSystemsOverlay"' in html, "More menu system directory must remain available"
          assert "Dashboard · แดชบอร์ด" in html and 'data-lm-en="Dashboard"' in html, "Member Dashboard entry missing"
          assert "แดชบอร์ดสมาชิก" in html, "Dashboard title missing"
          assert 'id="lmChatOverlay"' in html and 'data-system-target="chat"' in html, "Live chat UI and menu entry missing"
          assert 'href="./dual-ai.html"' in html, "Dual AI entry missing from More menu"
          assert 'id="lmChatOpen"' in html and '"./chat.js"' in sw, "Chat launcher and offline asset missing"
          assert "getElementById('account')" in chat and "scheduleReconnect" in chat, "Chat login and reconnect handling missing"
          assert 'src="./chat.js"' in html and "mars_chat_messages" in chat and "postgres_changes" in chat and "presence" in chat, "Live chat client integration missing"
          assert 'data-search-terms="ตลาด ซื้อขายที่ดิน ราคา mlc marketplace land listing"' in html, "Thai and English marketplace search terms missing"
          assert ".lm-system-grid{grid-template-columns:minmax(0,1fr)" in html, "mobile More menu must use readable single-column cards"
          assert manifest.get("display") == "standalone", "PWA standalone display missing"
          assert any(icon.get("sizes") == "192x192" for icon in manifest.get("icons", [])), "192px PWA icon declaration missing"
          assert any(icon.get("sizes") == "512x512" for icon in manifest.get("icons", [])), "512px PWA icon declaration missing"
          cache_match = re.search(r'const CACHE = "local-mars-v4-(\d+)"', sw)
          assert cache_match and int(cache_match.group(1)) >= 98, "service worker cache version must be v4-98 or newer"
          for page in ("dual-ai.html", "download-ai.html"):
              source = Path(page).read_text(encoding="utf-8")
              assert not re.search(r"[\u0E00-\u0E7F]", source), f"{page} must contain English-only UI text"
          assert 'id="local-mars-mobile-header-and-aegis-scale-v462"' in html, "mobile header and AEGIS layout fix missing"
          assert "colonyRoot.scale.setScalar(.30)" in html, "planetary AEGIS scale missing"
          assert "relaySatellite.scale.setScalar(.18)" in html, "planetary satellite scale missing"
          assert "radius:1.12" in html, "low Mars orbit scale missing"
          assert "COSMIC DIMENSION FIELD" in html, "layered cosmic star field missing"
          assert "const landingTargets=[pos(-4,14,1.0)" in html, "surface landing pad placement missing"
          assert "isNewParcel=Number(p.id.slice(2))>=13" in html, "new parcel beacon rendering missing"
          assert "const canAfford=walletReady&&balanceValue>=price" in html, "MLC insufficient-balance purchase guard missing"
          assert "TorusGeometry(.038,.0028,8,48)" in html, "new parcel gold surface ring missing"
          assert "M-019" in html and "19 parcels" in html, "new parcel range missing"
          assert 'src="./update-manager.js"' in html, "automatic update manager missing"
          assert '"./update-manager.js"' in sw, "update manager missing from offline cache"
          manager = Path("update-manager.js").read_text(encoding="utf-8")
          assert "registration.update()" in manager and "5 * 60 * 1000" in manager, "periodic online update checks missing"
          assert "controllerchange" in manager and "location.reload()" in manager, "automatic safe update application missing"
          assert manifest.get("start_url") == "./" and manifest.get("scope") == "./", "manifest paths must be relative to the GitHub Pages project root"
          assert th and en, "Thai and English dictionaries must not be empty"
          for icon in manifest.get("icons", []):
              path = icon.get("src", "").removeprefix("./")
              assert path and Path(path).is_file(), f"manifest icon missing: {path}"

          importmap = re.search(r'<script type="importmap">\s*(.*?)\s*</script>', html, re.S)
          assert importmap, "Three.js import map missing"
          imports = json.loads(importmap.group(1)).get("imports", {})
          assert imports.get("three", "").endswith("/build/three.module.js"), "Three.js module mapping missing"
          assert imports.get("three/addons/", "").endswith("/examples/jsm/"), "Three.js addons mapping missing"
          assert "from 'three/addons/controls/OrbitControls.js'" in html, "OrbitControls import missing"
          assert "location.href='./city.html'" in html and "location.href='./underground.html'" in html, "main navigation target missing"
          assert 'href="./m003-dimension-gate.html"' in Path("m003-base.html").read_text(encoding="utf-8"), "M-003 Dimension Gate link missing"
          assert "PROJECT DIMENSION GATE" in dimension_gate, "Dimension Gate page content missing"
          assert "Build a Resilient Mars Outpost" in mission, "Mission Trainer content missing"
          assert "EDUCATIONAL SIMULATION" in mission and "NASA is not affiliated" in mission, "Mission Trainer scientific boundary missing"
          assert 'href="./mission-trainer.html"' in html, "Mission Trainer navigation link missing"
          assert 'href="./news.html"' in html and "LOCAL MARS NEWS" in html, "LOCAL MARS NEWS navigation missing"
          assert "api.gdeltproject.org" in news and "world_events" in news, "Live news and member event sources missing"
          news_script = re.search(r"<script>(.*?)</script>", news, re.S)
          assert news_script, "LOCAL MARS NEWS script missing"
          Path("/tmp/mars-news.js").write_text(news_script.group(1), encoding="utf-8")

          for asset in (
              '"./"', '"./index.html"', '"./city.html"', '"./underground.html"', '"./mission-trainer.html"', '"./news.html"',
              '"./m003-base.html"', '"./m003-dimension-gate.html"', '"./top-secret-demo.html"',
              '"./civilization.html"', '"./i18n.js"', '"./premium-ui.css"',
              '"./world-server.js"', '"./member-workspace.js"', '"./multiverse.js"', '"./easy-play.js"',
              '"./locales/th.json"', '"./locales/en.json"',
              '"./manifest.webmanifest"', '"./icon.svg"'
          ):
              assert asset in sw, f"service worker precache entry missing: {asset}"
          for n in range(1, 20):
              assert f'"./parcels/M-{n:03}/index.html"' in sw, f"parcel offline cache entry missing: M-{n:03}"

          module = re.search(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          assert module, "application module missing"
          Path("/tmp/mars-main.mjs").write_text(module.group(1), encoding="utf-8")

          city_module = re.search(r'<script type="module">\s*(.*?)\s*</script>', city, re.S)
          assert city_module, "city builder module missing"
          assert 'id="lmGuideAccount"' in html and 'href="./city.html#construction"' in html, "actionable Guide links missing"
          assert "if(tab==='colony'){location.href='./city.html';return}" in html, "Colony navigation must open City Builder"
          assert 'id="construction"' in city and 'CONSTRUCTION WORKFLOW' in city, "English construction guide missing"
          assert 'id="place" class="primary wide" disabled' in city and 'id="remove" class="wide" disabled' in city, "construction actions must wait for a selected grid tile"
          assert "document.querySelector('#place').disabled=false" in city, "selecting a grid tile must enable construction"
          assert "mars_city_place_structure" in city, "online construction RPC integration missing"
          assert not re.search(r'[\\u0E00-\\u0E7F]', city), "City Builder must remain English-only"
          assert 'id="constructionList"' in city, "construction progress panel missing"
          assert "function updateConstructionJobs" in city, "construction simulation loop missing"
          assert "function updateConstructionCrew" in city and "rover.userData.armPivot" in city, "active construction crew animation missing"
          assert "site.foundation.scale.y" in city and "site.frame.scale.y" in city and "site.equipment.scale.y" in city, "progressive construction assembly animation missing"
          Path("/tmp/mars-city.mjs").write_text(city_module.group(1), encoding="utf-8")

          underground_script = re.search(r'<script>\s*(.*?)\s*</script>', underground, re.S)
          assert underground_script, "underground simulator script missing"
          assert "const floors=[" in underground_script.group(1), "24-level base data missing"
          Path("/tmp/mars-underground.js").write_text(underground_script.group(1), encoding="utf-8")

          mission_script = re.search(r"<script>\s*(.*?)\s*</script>", mission, re.S)
          assert mission_script, "Mission Trainer script missing"
          Path("/tmp/mars-mission.js").write_text(mission_script.group(1), encoding="utf-8")

          print("LOCAL MARS: app routes, all 19 parcel routes, M-003, TOP SECRET demo, premium assets, TH/EN dictionaries and PWA assets validated.")
          PY
          node --check /tmp/local-mars-dual-ai.js
          node --check solar-system.js
          node --check digital-assets.js
          node --check /tmp/mars-main.mjs
          node --check /tmp/mars-city.mjs
          node --check /tmp/mars-underground.js
          node --check /tmp/mars-mission.js
          node --check /tmp/mars-news.js
          node --check sw.js
          node --check update-manager.js
          node --check world-server.js
          node --check multiverse.js
          node --check easy-play.js
          node --check i18n.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare complete static site
        run: |
          mkdir -p _site
          cp index.html dual-ai.html download-ai.html install.html city.html underground.html mission-trainer.html news.html m003-base.html m003-dimension-gate.html top-secret-demo.html civilization.html i18n.js premium-ui.css world-server.js nasa-data.js member-workspace.js multiverse.js easy-play.js chat.js digital-assets.js solar-system.js update-manager.js manifest.webmanifest sw.js icon.svg _site/
          cp -R locales _site/locales
          cp -R parcels _site/parcels
          touch _site/.nojekyll
          test -s _site/dual-ai.html
          test -s _site/download-ai.html
          test -s _site/install.html
          test -s _site/member-workspace.js
          test -s _site/chat.js
          test -s _site/update-manager.js
          test -s _site/locales/th.json
          test -s _site/locales/en.json
          test -s _site/mission-trainer.html
          test -s _site/m003-base.html
          test -s _site/m003-dimension-gate.html
          test -s _site/top-secret-demo.html
          test -s _site/premium-ui.css
          test -s _site/parcels/M-001/index.html
          test -s _site/parcels/M-012/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
