name: LOCAL MARS uptime monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy LOCAL MARS to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: local-mars-uptime
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public app and critical assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://tordtaris.github.io/mars-land-explorer"
          for path in "/" "/world-server.js" "/member-workspace.js" "/chat.js" "/sw.js" "/manifest.webmanifest" "/icon.svg" "/city.html" "/underground.html" "/mission-trainer.html" "/news.html" "/locales/th.json" "/parcels/M-019/index.html"; do
            echo "Checking ${base}${path}"
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors --retry-delay 5 --max-time 25 "${base}${path}")"
            if [[ "${code}" != "200" ]]; then
              echo "::error::LOCAL MARS endpoint ${path} returned HTTP ${code}"
              exit 1
            fi
            echo "HTTP ${code} OK: ${path}"
          done

      - name: Check Supabase Auth health endpoint
        shell: bash
        run: |
          set -euo pipefail
          base="https://tordtaris.github.io/mars-land-explorer"
          # Supabase API gateway requires the project's public publishable key.
          # Read it from the deployed client config so key rotation stays in sync.
          publishable_key="$(curl --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --max-time 25 "${base}/world-server.js" | sed -n "s/.*key:'\\([^']*\\)'.*/\\1/p")"
          if [[ -z "${publishable_key}" ]]; then
            echo "::error::Could not read Supabase publishable key from deployed client config"
            exit 1
          fi
          url="https://tppgfxsdeuujidcjnfdl.supabase.co/auth/v1/health"
          code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors --retry-delay 5 --max-time 25 --header "apikey: ${publishable_key}" "${url}")"
          if [[ "${code}" != "200" ]]; then
            echo "::error::Supabase Auth health returned HTTP ${code}"
            exit 1
          fi
          echo "Supabase Auth health HTTP ${code} OK"
